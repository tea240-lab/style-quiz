dding:10px 12px;font-weight:800;font-size:15px;cursor:pointer} .primary{background:#2f5d50;color:white} .good{background:#dcefdc} .bad{background:#f5dddd} .ghost{background:#eee9e1} .btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px} .teams{display:grid;grid-template-columns:1fr;gap:6px} .team{display:grid;grid-template-columns:58px 1fr 58px;gap:6px;align-items:center;padding:8px;border-radius:10px;background:#f7f4ef} .team.active{outline:3px solid #e2b847} .qrwrap{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px} .qrcard{background:#fff;border-radius:14px;padding:10px;text-align:center;box-shadow:0 5px 15px #0001} .qrcard b{display:block;margin-bottom:5px} .qr{display:flex;justify-content:center} .qr img,.qr canvas{max-width:100%;height:auto!important} .tiny{font-size:11px;color:#6f685f;word-break:break-all;margin-top:5px} .warn{background:#fff1cf;border:1px solid #e7c36a;padding:10px;border-radius:10px;font-size:13px} @media(max-width:1050px){.layout{grid-template-columns:1fr}.qrwrap{grid-template-columns:repeat(2,1fr)}}

const QA=[{"q": "請完整說出洗臉五步驟。", "a": "⑴使用溫水將臉部打溼。\n⑵洗劑在手中搓揉成泡狀。\n⑶指腹以螺旋方式，由下而上、由內而外按摩全臉。\n⑷溫水沖淨後再以冷水輕拍，收縮毛孔。\n⑸毛巾輕拍擦乾臉部，並拭淨耳後與脖子。"}, {"q": "請說出兩項臉部清潔時需準備的物品。", "a": "髮帶或浴帽、溫水、臉部清潔洗劑或用品、冷水、毛巾。"}, {"q": "洗臉時，要使用手指的哪個部位按摩全臉？", "a": "指腹。"}, {"q": "洗臉時，為了讓臉部毛孔打開，需要使用什麼溫度的水洗臉？\n(A)熱水\n(B)溫水\n(C)冷水\n(D)冰水", "a": "(B)溫水"}, {"q": "洗臉時，如果要讓臉部毛孔收縮，需要使用什麼溫度的水洗臉？\n(A)熱水\n(B)溫水\n(C)冷水\n(D)冰水", "a": "(C)冷水"}, {"q": "請說出兩項油性皮膚的性質。", "a": "⑴皮脂腺分泌旺盛。\n⑵毛孔粗大，皮膚有油光。\n⑶易產生青春痘。"}, {"q": "請問臉部膚質大致分為哪三種？", "a": "油性、中性、乾性。"}, {"q": "適度清潔臉部可以避免臉部毛孔變如何？", "a": "1毛孔變大。"}, {"q": "請舉出兩項預防青春痘的方法。", "a": "⑴臉部常保持清潔，並採用正確的洗臉方式，切勿用力搓揉。\n⑵選擇刺激性小、溫和的洗劑，注意個人臉部肌膚的保養。\n⑶生活習慣要規律，作息要正常，定時排便，避免長期熬夜。\n⑷多吃蔬果，少吃甜食、刺激性和油炸食物。\n⑸長青春痘的部位避免用手擠壓，以免引發感染，甚至留下疤痕。\n⑹青春痘情況較嚴重者，需及早請皮膚科醫師診治。"}, {"q": "臉部洗劑使用前最好先做什麼動作，以免傷害皮膚？", "a": "搓揉起泡。"}, {"q": "下列有關洗臉時臉部搓洗的順序，何者正確？\n(A)由下而上，由外而內\n(B)由下而上，由內而外\n(C)由上而下，由外而內\n(D)由上而下，由內而外", "a": "(B)由下而上，由內而外"}, {"q": "請完整說出梳髮四步驟。", "a": "⑴由前往後將頭髮梳順。\n⑵低下頭由髮根梳至髮尾。\n⑶由左側梳向右側， 再由右側梳向左側。\n⑷梳理完後以指腹按摩，促進血液循環。"}, {"q": "請說出一項日常頭皮保養的方式。", "a": "⑴每天固定梳理。\n⑵以指腹按摩。"}, {"q": "頭髮洗完後，使用吹風機吹頭髮，吹風機需距離頭髮多遠比較適合？", "a": "15～20公分"}, {"q": "梳子尖端應選擇什麼形狀比較不會傷害頭皮？", "a": "選擇尖端較圓的梳子。"}, {"q": "洗完頭之後，頭髮要乾到什麼程度之後梳理，比較不會造成斷髮？", "a": "半乾。"}, {"q": "請完整說出洗髮五步驟。", "a": "⑴頭髮梳順後，以溫水打溼。\n⑵洗髮精加水揉出泡沫後，以指腹輕輕按摩頭皮及揉擦髮絲。\n⑶以溫水充分沖洗乾淨，再以稍冷的水收縮毛孔。\n⑷以乾毛巾輕輕按壓頭部和髮絲，吸取水分，不可用力搓擦頭髮。\n⑸待頭髮半乾後再梳頭及使用吹風機吹頭髮(距離約15∼20公分)。"}, {"q": "洗髮前的梳髮有什麼功用？", "a": "避免頭髮打結。"}, {"q": "請說出一項與人交談時表示尊重的表情。", "a": "⑴注視對方。\n⑵專心聆聽。"}, {"q": "到親友家拜訪，停留大約多久時間最適合？", "a": "約30分鐘。"}, {"q": "進入他人房間的生活禮儀為何？\n(A)直接闖進去\n(B)敲門後直接進入\n(C)不要進入他人房間\n(D)敲門後等對方應門後再進入", "a": "(D)敲門後等對方應門後再進入"}, {"q": "請說出兩項尊重別人隱私不能做的事情。", "a": "⑴不偷窺。\n⑵不偷聽。\n⑶不拆閱他人信件。\n⑷不擅用他人物品。"}, {"q": "請說出兩項搭乘大眾交通運輸工具時應注意的禮儀。", "a": "⑴禮讓老弱婦孺、孕婦乘車。\n⑵上車時禮讓下車的乘客。\n⑶交談時不宜大聲嘻笑。\n⑷後背包應改用手提。"}, {"q": "請說出兩項欣賞藝文活動時(如音樂會、戲劇、演唱會、電影等)，要注意的禮儀。", "a": "⑴應提前入座。\n⑵節目進行中切勿大聲喧譁或批評。\n⑶適時給予掌聲。\n⑷節目結束後依序離席，不爭先恐後。"}, {"q": "請說出兩項在圖書館時的禮儀。", "a": "⑴保持安靜。\n⑵避免占據太大的桌面。\n⑶遵守圖書館規定。\n⑷按時歸還書籍。"}, {"q": "請說出一項搭乘電梯的基本禮儀。", "a": "⑴應禮讓電梯內的人先出來(先出後進)。\n⑵進入電梯後，面朝門站立。\n⑶在電梯內應小聲交談，不可大聲喧譁。"}, {"q": "請說出兩項公共場所應注意的禮儀？", "a": "⑴不要大聲喧譁、奔跑。\n⑵搭乘大眾交通運輸工具，後背包應改用手提。\n⑶行進間勿使用手機。\n⑷與長輩同行要退於左後方一步，必要時應給予攙扶或協助。\n⑸交談(或用手機對話時)要輕聲，不宜大聲談笑或嬉鬧。\n⑹搭乘電梯時應禮讓電梯內的人先出來(先出後進)，進入電梯後面朝門站立。\n⑺在圖書館要保持安靜，避免占據太大的桌面；要遵守規定，按時歸還書籍。\n⑻欣賞音樂會、戲劇、演唱會、電影時應提前入座、節目進行中切勿大聲喧譁或批評，並適時給予掌聲，節目結束後依次離席，不爭先恐後。\n⑼參觀展覽時應保持安靜，不可用手碰觸作品。\n⑽進入餐廳時，應由侍者帶領入座，需要服務時，可舉手示意侍者。"}, {"q": "下列關於正確站姿的敘述，何者錯誤？\n(A)抬頭\n(B)收下巴\n(C)八字站立\n(D)脊椎挺直", "a": "(C)八字站立"}, {"q": "請說出兩項錯誤的坐姿。", "a": "⑴搖晃椅子。\n⑵抖腳。\n⑶翹二郎腿。\n⑷兩腳交纏。\n⑸脫下鞋襪。"}, {"q": "請說出兩項外出時的注意事項。", "a": "⑴告知家人去處。\n⑵告知家人預計回家時間。\n⑶逾時應先打電話通知家人。"}, {"q": "下列何者為與人交談時應有的禮儀？\n(A)命令的口氣\n(B)讚美的言詞\n(C)刺探他人隱私\n(D)語言攻擊他人", "a": "(B) 讚美的言詞"}, {"q": "下列哪個動作可以在與人交談時出現？\n(A)補妝\n(B)脫襪子\n(C)在對方面前整理衣服\n(D)輕聲細語，面帶微笑", "a": "(D)輕聲細語，面帶微笑"}, {"q": "下列哪個情形符合與人聊天時的禮儀？\n(A)適時傾聽對方想說的話\n(B)只講自己想講的，不管別人想不想聽\n(C)問一些隱私的話題，例如：薪水、年紀\n(D)別人講話時，聽到自己有興趣的部分，就插嘴加入話題", "a": "(A)適時傾聽對方想說的話"}, {"q": "下列何者是尊重他人隱私的行為？\n(A)拆閱別人的書信\n(B)進入他人房間前先敲門\n(C)問朋友年紀到了怎麼還不結婚\n(D)未經允許窺探別人電腦裡的資料", "a": "(B)進入他人房間前先敲門"}, {"q": "下列何者符合與長輩同行時相對位置的禮儀？\n(A)站在長輩正前方\n(B)站在長輩左前方一步\n(C)站在長輩左後方一步\n(D)站在長輩右後方一步", "a": "(C)站在長輩左後方一步"}, {"q": "我的叔叔有時候講話很大聲，而且常帶有髒話。請問：我的叔叔需要改善的地方為何？", "a": "⑴調整說話的音量。\n⑵不應該說髒話。"}, {"q": "表姐的女兒今年9歲，穿著裙子，坐下來的時候，腳開開的還學起爸爸抖腳。請問：表姐的女兒需要改善的地方為何？", "a": "⑴雙腳自然靠攏。\n⑵膝蓋不宜張開。\n⑶雙手放在腿上。"}, {"q": "我的同學每天走路回家都彎腰駝背，而且低頭滑手機。請問：我的同學需要改善的地方為何？", "a": "⑴抬頭挺胸、收小腹、手臂自然靠著身體擺動。\n⑵手機收回包包裡，看前方。"}, {"q": "星期六晚上，小明臨時決定去阿華家拜訪。小明直接到阿華家敲門， 阿華出來迎接時穿著隨便。請問： 小明與阿華有哪些地方需要改善？", "a": "⑴小明拜訪前應事前預約時間，確認阿華是否在家。\n⑵小明拜訪阿華的時間應盡量安排在非假日。\n⑶阿華出來迎接小明時應穿著整齊。"}, {"q": "小康的哥哥經常偷聽小康講電話， 還偷拆同學寄給小康的聖誕卡片。請問： 小康的哥哥做錯了哪些 事情？", "a": "不尊重小康的隱私： 偷聽小康講電話、偷拆小康的聖誕卡片。"}, {"q": "請說出兩項穿衣原則。", "a": "⑴符合自己的身分。\n⑵符合自己的年齡。\n⑶無髒汙、破損或過皺。\n⑷尺寸是否合身。"}, {"q": "說出本組服裝儀容應改善的地方。", "a": "請學生依實際情形作答。"}]; const N=32; const diceChars=['⚀','⚁','⚂','⚃','⚄','⚅'];
const colors=['#d94f4f','#3c78d8','#2f8f5b','#9b59b6','#e69138'];
let room=new URLSearchParams(location.search).get('room')||Math.random().toString(36).slice(2,8).toUpperCase(); document.getElementById('room').textContent=room;
let db=null, ref=null, state={turn:0,positions:[0,0,0,0,0],scores:[0,0,0,0,0],rollSeq:0,lastRoll:0,lastGroup:-1,questionIndex:-1,awaiting:false};
function configured(){return window.FIREBASE_CONFIG && !String(window.FIREBASE_CONFIG.apiKey||'').includes('請貼上')}
if(configured()){firebase.initializeApp(window.FIREBASE_CONFIG);db=firebase.database();ref=db.ref('monopolyRooms/'+room);ref.on('value',s=>{if(s.exists()){state=Object.assign(state,s.val());render();handleRoll();}else ref.set(state)})} else document.getElementById('warn').style.display='block';
function path(i){let r,c;if(i<=8){r=9;c=9-i}else if(i<=16){r=9-(i-8);c=1}else if(i<=24){r=1;c=1+(i-16)}else{r=1+(i-24);c=9}return [r,c]}
function type(i){if(i===0)return['start','START'];if([7,15,23,31].includes(i))return['chance','機會'];if([4,12,20,28].includes(i))return['rest','休息'];return['question','題目']}
function buildBoard(){const b=document.getElementById('board');for(let i=0;i<N;i++){const [r,c]=path(i),[cl,lab]=type(i);let d=document.createElement('div');d.className='cell '+cl;d.style.gridRow=r;d.style.gridColumn=c;d.id='c'+i;d.innerHTML=`<span class="n">${i}</span><span class="lab">${lab}</span><div class="tokens"></div>`;b.appendChild(d)}} buildBoard();
function render(){for(let i=0;i<N;i++)document.querySelector('#c'+i+' .tokens').innerHTML='';state.positions.forEach((p,g)=>{let t=document.createElement('span');t.className='tok';t.style.background=colors[g];t.textContent=g+1;document.querySelector('#c'+(p%N)+' .tokens').appendChild(t)});document.getElementById('turn').textContent=`第${state.turn+1}組回合`;document.getElementById('dice').textContent=state.lastRoll?diceChars[state.lastRoll-1]:'⚀';document.getElementById('status').textContent=state.awaiting?'請老師判定答案':`等待第${state.turn+1}組擲骰`;let x='';state.positions.forEach((p,i)=>x+=`<div class="team ${i===state.turn?'active':''}"><b>第${i+1}組</b><span>位置 ${p} 格</span><b>${state.scores[i]} 分</b></div>`);document.getElementById('teams').innerHTML=x;if(state.questionIndex>=0){document.getElementById('question').textContent=QA[state.questionIndex].q;document.getElementById('answer').textContent=QA[state.questionIndex].a}}
let seenSeq=0;function handleRoll(){if(!state.rollSeq||state.rollSeq===seenSeq)return;seenSeq=state.rollSeq;let g=state.lastGroup,n=state.lastRoll;if(g<0)return;let pos=state.positions[g];state.positions[g]=pos+n;let cell=state.positions[g]%N;let [cl]=type(cell);if(cl==='chance'){let delta=Math.random()<.5?2:-2;state.positions[g]=Math.max(0,state.positions[g]+delta);document.getElementById('question').textContent=`🎁 機會格：${delta>0?'前進':'後退'} 2 格！`;state.questionIndex=-1;state.awaiting=true}else if(cl==='rest'||cl==='start'){document.getElementById('question').textContent='☕ 休息格：本回合免答題。';state.questionIndex=-1;state.awaiting=true}else{state.questionIndex=Math.floor(Math.random()*QA.length);state.awaiting=true}save();render()}
function save(){if(ref)ref.set(state)} function toggleAnswer(){let a=document.getElementById('answer');a.style.display=a.style.display==='block'?'none':'block'}
function judge(ok){if(!state.awaiting)return;if(ok)state.scores[state.turn]=(state.scores[state.turn]||0)+1;nextTurn()} function nextTurn(){state.awaiting=false;state.questionIndex=-1;state.turn=(state.turn+1)%5;state.lastRoll=0;document.getElementById('question').textContent='等待擲骰……';document.getElementById('answer').style.display='none';save();render()}
function resetGame(){if(!confirm('確定重新開始？'))return;state={turn:0,positions:[0,0,0,0,0],scores:[0,0,0,0,0],rollSeq:0,lastRoll:0,lastGroup:-1,questionIndex:-1,awaiting:false};seenSeq=0;save();render()} function newRoom(){location.href=location.pathname+'?room='+Math.random().toString(36).slice(2,8).toUpperCase()}
function makeQR(){let wrap=document.getElementById('qrs');let base=new URL('student.html',location.href);for(let g=1;g<=5;g++){let u=new URL(base);u.searchParams.set('room',room);u.searchParams.set('group',g);let card=document.createElement('div');card.className='qrcard';card.innerHTML=`<b>第${g}組</b><div class="qr" id="qr${g}"></div><div class="tiny">掃碼擲骰</div>`;wrap.appendChild(card);new QRCode(document.getElementById('qr'+g),{text:u.href,width:130,height:130})}} makeQR();render();
</script></body></html>
