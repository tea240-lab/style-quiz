<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="firebase-config.js"></script><title>形象好手｜學生擲骰</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei",system-ui,sans-serif;background:#f5f1e8;min-height:100vh;display:grid;place-items:center;color:#292622}.card{width:min(92vw,440px);background:#fff;border-radius:28px;padding:28px;text-align:center;box-shadow:0 15px 45px #0002}h1{font-size:34px;margin:0}.room{margin:8px;color:#777}.dice{font-size:120px;line-height:1.2;margin:12px}button{width:100%;border:0;border-radius:22px;padding:22px;font-size:30px;font-weight:900;background:#2f5d50;color:#fff;cursor:pointer}button:disabled{background:#bbb;cursor:not-allowed}.msg{font-size:20px;font-weight:800;margin-top:18px;min-height:58px}.warn{background:#fff1cf;padding:10px;border-radius:10px;margin-top:10px}</style></head><body><div class="card"><h1 id="group">第?組</h1><div class="room">房間 <span id="room"></span></div><div id="dice" class="dice">⚀</div><button id="roll" disabled>🎲 擲骰子</button><div id="msg" class="msg">連線中……</div><div id="warn" class="warn" style="display:none">尚未設定 Firebase</div></div><script>
const p=new URLSearchParams(location.search),room=p.get('room'),group=Number(p.get('group'));document.getElementById('room').textContent=room||'—';document.getElementById('group').textContent=`第${group||'?'}組`;const chars=['⚀','⚁','⚂','⚃','⚄','⚅'];let ref,state,rolling=false;
function configured(){return window.FIREBASE_CONFIG && !String(window.FIREBASE_CONFIG.apiKey||'').includes('請貼上')}
if(!configured()){document.getElementById('warn').style.display='block';document.getElementById('msg').textContent='請老師先完成 Firebase 設定'}else if(!room||group<1||group>5){document.getElementById('msg').textContent='QR Code 連結不正確'}else{firebase.initializeApp(window.FIREBASE_CONFIG);ref=firebase.database().ref('monopolyRooms/'+room);ref.on('value',s=>{state=s.val();update()})}
function update(){let btn=document.getElementById('roll'),msg=document.getElementById('msg');if(!state){btn.disabled=true;msg.textContent='等待老師開啟遊戲'}else if(state.awaiting){btn.disabled=true;msg.textContent='老師正在判定上一題'}else if(state.turn!==group-1){btn.disabled=true;msg.textContent=`現在輪到第${state.turn+1}組`}else{btn.disabled=false;msg.textContent='輪到你們了！請擲骰 🎲'}}
document.getElementById('roll').onclick=async()=>{
  if(!state || state.turn!==group-1 || state.awaiting || rolling) return;

  rolling=true;
  const btn=document.getElementById('roll');
  btn.disabled=true;

  // 先向 Firebase 搶本回合的擲骰權
  const lock=await ref.transaction(current=>{
    if(!current) return;

    // 只有目前輪到的組，而且尚未有人擲骰，才能取得鎖
    if(current.turn!==group-1 || current.awaiting){
      return;
    }

    current.awaiting=true;
    return current;
  });

  // 沒搶到：代表另一支手機已經先擲了
  if(!lock.committed){
    rolling=false;
    document.getElementById('msg').textContent='本回合已由其他同學擲骰';
    return;
  }

  // 搶到後才真正擲骰
  let n=1;
  for(let i=0;i<10;i++){
    n=1+Math.floor(Math.random()*6);
    document.getElementById('dice').textContent=chars[n-1];
    await new Promise(r=>setTimeout(r,70+i*8));
  }

  document.getElementById('msg').textContent=`擲到 ${n} 點！`;

  await ref.update({
    lastRoll:n,
    lastGroup:group-1,
    rollSeq:(state.rollSeq||0)+1
  });

  rolling=false;
}
  </script>
</body>
</html>
